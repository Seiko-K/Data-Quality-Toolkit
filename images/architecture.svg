  </text>

  <rect x="360" y="420" width="280" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">
