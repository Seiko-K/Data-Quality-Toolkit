<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">
    Data Quality Toolkit
  </text>

  <text x="500" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">
