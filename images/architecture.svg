  </text>

  <line x1="500" y1="345" x2="500" y2="390" stroke="#6b7280" stroke-width="3"/>
  <line x1="250" y1="390" x2="750" y2="390" stroke="#6b7280" stroke-width="3"/>
  <line x1="250" y1="390" x2="250" y2="420" stroke="#6b7280" stroke-width="3"/>
  <line x1="500" y1="390" x2="500" y2="420" stroke="#6b7280" stroke-width="3"/>
  <line x1="750" y1="390" x2="750" y2="420" stroke="#6b7280" stroke-width="3"/>

  <rect x="110" y="420" width="280" height="70" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#78350f">
