  </text>

  <line x1="500" y1="205" x2="500" y2="255" stroke="#6b7280" stroke-width="3"/>
  <polygon points="500,265 492,250 508,250" fill="#6b7280"/>

  <rect x="285" y="270" width="430" height="75" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="500" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#164e63">
