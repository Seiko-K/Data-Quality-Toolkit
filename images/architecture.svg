  </text>

  <rect x="300" y="125" width="400" height="80" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="500" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312e81">
